; Maze -- Zufalls-Labyrinth mit Joystick-Steuerung auf dem ILI9488
; ESP32-S3 N16R8 + ILI9488 via SPI, LovyanGFX
;
; Build:   pio run
; Upload:  pio run -t upload
; Serial:  pio device monitor

[platformio]
default_envs = maze

[env:maze]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_port = COM8
monitor_filters = esp32_exception_decoder
build_unflags =
    -Os
    -g
; Debug-Build: -O0 (nichts wird wegoptimiert, Backtrace-Zeilen sind exakt)
; und -g2 (volle Debug-Infos). Bewusst kein -Og: Optimierter Code verschiebt
; Statement-Grenzen, dadurch zeigt der Backtrace oft die falsche Zeile.
; -g wird entfernt, weil die Toolchain bereits "-ggdb" setzt und eine spaetere
; "-g" den Debug-Level wieder reduzieren wuerde.
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Iinclude
    -O0
    -g2
; Serial-Ausgabe laeuft ueber UART0 (GPIO43/44) und damit ueber den
; CH343-USB-Bridge (COM8). Deshalb bewusst KEIN
; -DARDUINO_USB_CDC_ON_BOOT=1 / -DARDUINO_USB_MODE=1:
; mit USB-CDC landet Serial auf dem nativen USB-Port (GPIO19/20), waehrend
; der ROM-Bootloader weiter ueber den CH343 spricht.
lib_deps =
    lovyan03/LovyanGFX@^1.2.34
; N16R8-Modul: 16 MB Flash im OPI-Modus + 8 MB OPI-PSRAM.
; Ohne diese Option nimmt die PlatformIO-Boarddefinition "esp32-s3-devkitc-1"
; die N8-Variante (8 MB Flash, kein PSRAM).
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_src_filter = +<main.cpp> +<Joystick.cpp> +<Selftest.cpp>
