name: PlatformIO CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (maze)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cache der PlatformIO-Pakete (Toolchain, ESP32-Framework, LovyanGFX).
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build maze
        run: pio run -e maze

      # Firmware als Artefakt, damit man direkt flashen kann ohne Rebuild.
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-maze
          path: |
            .pio/build/maze/firmware.bin
            .pio/build/maze/bootloader.bin
            .pio/build/maze/partitions.bin
          if-no-files-found: error
          retention-days: 14
